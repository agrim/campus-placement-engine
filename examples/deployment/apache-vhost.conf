<VirtualHost *:80>
  ServerName placements.example.edu
  DocumentRoot /var/www/campus-placement-engine/public

  <Directory /var/www/campus-placement-engine>
    AllowOverride None
    Require all denied
  </Directory>

  <Directory /var/www/campus-placement-engine/public>
    Options -Indexes +FollowSymLinks
    # public/.htaccess sends clean browser and /api/v1 paths to index.php.
    AllowOverride All
    Require all granted
  </Directory>

  ErrorLog ${APACHE_LOG_DIR}/campus-placement-engine-error.log
  CustomLog ${APACHE_LOG_DIR}/campus-placement-engine-access.log combined
</VirtualHost>
