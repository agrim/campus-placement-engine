server {
  listen 80;
  server_name placements.example.edu;
  root /var/www/campus-placement-engine/public;
  index index.php;

  location / {
    # Preserve clean browser and /api/v1 paths while serving real assets directly.
    try_files $uri /index.php?$query_string;
  }

  location ~ \.php$ {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    fastcgi_pass unix:/run/php/php8.2-fpm.sock;
  }

  location ~ /\.(?!well-known) {
    deny all;
  }

  location ~* \.(sqlite|sqlite3|db|sql|env|ini|log|bak|jsonl)$ {
    deny all;
  }
}
