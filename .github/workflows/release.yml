name: Publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Verify and publish release assets
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cpe
          POSTGRES_PASSWORD: cpe-contract-password
          POSTGRES_DB: cpe_contract
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cpe -d cpe_contract"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_sqlite, sqlite3, pdo_pgsql, curl
          coverage: none

      - name: Validate release tag and source branch
        shell: bash
        run: |
          CPE_RELEASE_VERSION="$(php -r '$config = require "config/defaults.php"; echo $config["app"]["version"];')"
          test "v${CPE_RELEASE_VERSION}" = "${GITHUB_REF_NAME}"
          test -f "docs/releases/${GITHUB_REF_NAME}.md"
          git fetch origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main

      - name: Lint and test release candidate
        env:
          CPE_DB_DRIVER: sqlite
        run: |
          find app config public tests -name '*.php' -print0 | xargs -0 -n 1 php -l
          php -l placement
          php tests/run.php
          php tests/database_contract.php
          php tests/managed_hosting_contract.php

      - name: Test PostgreSQL data plane
        env:
          CPE_DB_DRIVER: pgsql
          CPE_DATABASE_URL: postgresql://cpe:cpe-contract-password@127.0.0.1:5432/cpe_contract?sslmode=disable
        run: php tests/database_contract.php

      - name: Build and verify downloadable assets
        shell: bash
        run: |
          CPE_RELEASE_VERSION="$(php -r '$config = require "config/defaults.php"; echo $config["app"]["version"];')"
          php placement publication-check
          php placement package --target=dist
          php placement verify-package "dist/campus-placement-engine-${CPE_RELEASE_VERSION}.tar.gz"
          php placement verify-package "dist/campus-placement-engine-${CPE_RELEASE_VERSION}.zip"
          cd dist
          sha256sum --check SHA256SUMS

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CPE_RELEASE_NOTES="docs/releases/${GITHUB_REF_NAME}.md"
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            gh release create "${GITHUB_REF_NAME}" \
              dist/*.tar.gz dist/*.zip dist/*.sha256 dist/SHA256SUMS \
              --verify-tag \
              --prerelease \
              --title "Campus Placement Engine ${GITHUB_REF_NAME}" \
              --notes-file "${CPE_RELEASE_NOTES}"
          else
            gh release create "${GITHUB_REF_NAME}" \
              dist/*.tar.gz dist/*.zip dist/*.sha256 dist/SHA256SUMS \
              --verify-tag \
              --title "Campus Placement Engine ${GITHUB_REF_NAME}" \
              --notes-file "${CPE_RELEASE_NOTES}"
          fi
