name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP 8.2
    runs-on: ubuntu-latest
    env:
      CPE_POSTGRES_POOL_MODE: direct
      CPE_POSTGRES_ALLOW_INSECURE_LOOPBACK: "1"
      CPE_POSTGRES_TLS_TEST_URL: ${{ secrets.CPE_POSTGRES_TLS_TEST_URL }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cpe
          POSTGRES_PASSWORD: cpe-contract-password
          POSTGRES_DB: cpe_contract
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cpe -d cpe_contract"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo_sqlite, sqlite3, pdo_pgsql, curl
          coverage: none

      - name: Validate public schemas with pinned Draft 2020-12 tooling
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/cpe-public-schema-validator"
          "$RUNNER_TEMP/cpe-public-schema-validator/bin/python" -m pip install --disable-pip-version-check --requirement tests/requirements-public-event-schema.txt
          "$RUNNER_TEMP/cpe-public-schema-validator/bin/python" tests/validate_public_event_schemas.py
          echo "CPE_TEST_SCHEMA_PYTHON=$RUNNER_TEMP/cpe-public-schema-validator/bin/python" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/cpe-public-schema-validator/bin" >> "$GITHUB_PATH"

      - name: Install PostgreSQL 17 client
        shell: bash
        run: |
          set -euo pipefail
          PGDG_KEY="$RUNNER_TEMP/postgresql-pgdg.asc"
          curl --fail --silent --show-error --location \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            --output "$PGDG_KEY"
          printf '%s  %s\n' \
            '0144068502a1eddd2a0280ede10ef607d1ec592ce819940991203941564e8e76' \
            "$PGDG_KEY" | sha256sum --check --strict
          sudo install -d -m 0755 /etc/apt/keyrings
          sudo install -m 0644 "$PGDG_KEY" /etc/apt/keyrings/postgresql-pgdg.asc
          . /etc/os-release
          printf '%s\n' \
            "deb [signed-by=/etc/apt/keyrings/postgresql-pgdg.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/postgresql-pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client-17
          /usr/lib/postgresql/17/bin/pg_dump --version
          /usr/lib/postgresql/17/bin/pg_restore --version

      - name: Show runtime
        run: php -v

      - name: Lint PHP files
        run: |
          find app config public tests -name '*.php' -print0 | xargs -0 -n 1 php -l
          php -l placement

      - name: Run exact public alpha.1 compatibility acceptance
        shell: bash
        run: |
          CPE_ALPHA1_SOURCE="$RUNNER_TEMP/cpe-alpha1-source"
          CPE_ALPHA1_DATABASE="$RUNNER_TEMP/cpe-alpha1-installed.sqlite"
          CPE_ALPHA1_BACKUPS="$RUNNER_TEMP/cpe-alpha1-backups"
          mkdir -p "$CPE_ALPHA1_SOURCE" "$CPE_ALPHA1_BACKUPS"
          git archive --format=tar v0.1.0-alpha.1 | tar -x -C "$CPE_ALPHA1_SOURCE"
          CPE_DB_DRIVER=sqlite CPE_DB_PATH="$CPE_ALPHA1_DATABASE" php "$CPE_ALPHA1_SOURCE/placement" install-demo
          CPE_DB_DRIVER=sqlite CPE_DB_PATH="$CPE_ALPHA1_DATABASE" CPE_BACKUP_DIR="$CPE_ALPHA1_BACKUPS" php "$CPE_ALPHA1_SOURCE/placement" backup
          mapfile -t CPE_ALPHA1_ARCHIVES < <(find "$CPE_ALPHA1_BACKUPS" -maxdepth 1 -type f -name '*.sqlite' -print)
          test "${#CPE_ALPHA1_ARCHIVES[@]}" -eq 1
          CPE_ALPHA1_DATABASE_FIXTURE="$CPE_ALPHA1_DATABASE" CPE_ALPHA1_BACKUP_FIXTURE="${CPE_ALPHA1_ARCHIVES[0]}" php tests/alpha1_release_acceptance.php

      - name: Run test suite
        run: |
          php tests/run.php
          php tests/authorization_failure_contract.php
          php tests/authorization_state_contract.php
          php tests/installation_state_contract.php
          php tests/internal_module_boundary_contract.php
          php tests/internal_event_delivery_contract.php
          php tests/backup_restore_contract.php
          php tests/database_connection_cleanup_contract.php
          php tests/incident_boundary_contract.php
          php tests/legacy_backup_compatibility_contract.php
          php tests/worker_delivery_contract.php
          php tests/public_event_contract.php
          php tests/webhook_delivery_contract.php
          php tests/webhook_delivery_concurrency_contract.php
          php tests/webhook_revoke_completion_concurrency_contract.php
          php tests/webhook_capture_revoke_concurrency_contract.php
          php tests/webhook_receiver_example_contract.php
          php tests/postgres_connection_policy_contract.php
          php tests/postgres_tls_contract.php
          php tests/database_contract.php
          php tests/mutation_concurrency_contract.php
          php tests/database_ownership_contract.php
          php tests/migration_lock_contract.php
          php tests/database_lock_release_contract.php
          php tests/install_concurrency_contract.php
          php tests/hosted_install_atomicity_contract.php
          php tests/hosted_install_preflight_contract.php
          php tests/setup_authorization_contract.php
          php tests/hosted_install_contract.php
          php tests/managed_hosting_contract.php

      - name: Run PostgreSQL database contract
        env:
          CPE_DB_DRIVER: pgsql
          CPE_DATABASE_URL: postgresql://cpe:cpe-contract-password@127.0.0.1:5432/cpe_contract?sslmode=disable
        run: php tests/database_contract.php

      - name: Run PostgreSQL public event contract
        env:
          CPE_DB_DRIVER: pgsql
          CPE_DATABASE_URL: postgresql://cpe:cpe-contract-password@127.0.0.1:5432/cpe_public_event_contract?sslmode=disable
          PGPASSWORD: cpe-contract-password
        run: |
          psql -h 127.0.0.1 -U cpe -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE cpe_public_event_contract'
          php tests/public_event_contract.php

      - name: Run PostgreSQL signed webhook delivery contract
        env:
          CPE_DB_DRIVER: pgsql
          CPE_DATABASE_URL: postgresql://cpe:cpe-contract-password@127.0.0.1:5432/cpe_webhook_delivery_contract?sslmode=disable
          CPE_WEBHOOK_TEST_PRIVILEGED_HEALTH: "1"
          PGPASSWORD: cpe-contract-password
        run: |
          psql -h 127.0.0.1 -U cpe -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE cpe_webhook_delivery_contract'
          php tests/webhook_delivery_contract.php

      - name: Run PostgreSQL signed webhook concurrency contract
        env:
          CPE_DB_DRIVER: pgsql
          CPE_DATABASE_URL: postgresql://cpe:cpe-contract-password@127.0.0.1:5432/cpe_webhook_delivery_concurrency_contract?sslmode=disable
          PGPASSWORD: cpe-contract-password
        run: |
          psql -h 127.0.0.1 -U cpe -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE cpe_webhook_delivery_concurrency_contract'
          php tests/webhook_delivery_concurrency_contract.php

      - name: Run PostgreSQL webhook revoke/completion concurrency contract
        env:
          CPE_DB_DRIVER: pgsql
          CPE_DATABASE_URL: postgresql://cpe:cpe-contract-password@127.0.0.1:5432/cpe_webhook_revoke_completion_concurrency_contract?sslmode=disable
          PGPASSWORD: cpe-contract-password
        run: |
          psql -h 127.0.0.1 -U cpe -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE cpe_webhook_revoke_completion_concurrency_contract'
          php tests/webhook_revoke_completion_concurrency_contract.php

      - name: Run PostgreSQL webhook capture/revoke concurrency contract
        env:
          CPE_DB_DRIVER: pgsql
          CPE_DATABASE_URL: postgresql://cpe:cpe-contract-password@127.0.0.1:5432/cpe_webhook_capture_revoke_concurrency_contract?sslmode=disable
          PGPASSWORD: cpe-contract-password
        run: |
          psql -h 127.0.0.1 -U cpe -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE cpe_webhook_capture_revoke_concurrency_contract'
          php tests/webhook_capture_revoke_concurrency_contract.php

      - name: Run PostgreSQL authorization and internal observer contracts
        env:
          CPE_DB_DRIVER: pgsql
          PGPASSWORD: cpe-contract-password
        run: |
          psql -h 127.0.0.1 -U cpe -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE cpe_authorization_state_contract'
          CPE_DATABASE_URL='postgresql://cpe:cpe-contract-password@127.0.0.1:5432/cpe_authorization_state_contract?sslmode=disable' php tests/authorization_state_contract.php
          psql -h 127.0.0.1 -U cpe -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE cpe_installation_state_contract'
          CPE_DATABASE_URL='postgresql://cpe:cpe-contract-password@127.0.0.1:5432/cpe_installation_state_contract?sslmode=disable' php tests/installation_state_contract.php
          psql -h 127.0.0.1 -U cpe -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE cpe_internal_event_contract'
          CPE_DATABASE_URL='postgresql://cpe:cpe-contract-password@127.0.0.1:5432/cpe_internal_event_contract?sslmode=disable' php tests/internal_event_delivery_contract.php

      - name: Run PostgreSQL mutation concurrency contract
        env:
          CPE_DB_DRIVER: pgsql
          CPE_DATABASE_URL: postgresql://cpe:cpe-contract-password@127.0.0.1:5432/cpe_mutation_concurrency_contract?sslmode=disable
          PGPASSWORD: cpe-contract-password
        run: |
          psql -h 127.0.0.1 -U cpe -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE cpe_mutation_concurrency_contract'
          php tests/mutation_concurrency_contract.php

      - name: Run PostgreSQL worker delivery contract
        env:
          CPE_DB_DRIVER: pgsql
          CPE_DATABASE_URL: postgresql://cpe:cpe-contract-password@127.0.0.1:5432/cpe_worker_contract?sslmode=disable
          PGPASSWORD: cpe-contract-password
        run: |
          psql -h 127.0.0.1 -U cpe -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE cpe_worker_contract'
          php tests/worker_delivery_contract.php

      - name: Run PostgreSQL backup/restore contract
        env:
          CPE_DB_DRIVER: pgsql
          CPE_DATABASE_URL: postgresql://cpe:cpe-contract-password@127.0.0.1:5432/cpe_backup_restore_contract?sslmode=disable
          CPE_PG_DUMP_BINARY: /usr/lib/postgresql/17/bin/pg_dump
          CPE_PG_RESTORE_BINARY: /usr/lib/postgresql/17/bin/pg_restore
          PGPASSWORD: cpe-contract-password
        run: |
          psql -h 127.0.0.1 -U cpe -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE cpe_backup_restore_contract'
          php tests/backup_restore_contract.php

      - name: Run PostgreSQL hosted-install contract
        env:
          CPE_DB_DRIVER: pgsql
          CPE_DATABASE_URL: postgresql://cpe:cpe-contract-password@127.0.0.1:5432/cpe_hosted_contract?sslmode=disable
          PGPASSWORD: cpe-contract-password
        run: |
          psql -h 127.0.0.1 -U cpe -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE cpe_hosted_contract'
          php tests/hosted_install_contract.php

      - name: Run PostgreSQL hosted-install atomicity contract
        env:
          CPE_DB_DRIVER: pgsql
          CPE_DATABASE_URL: postgresql://cpe:cpe-contract-password@127.0.0.1:5432/cpe_hosted_atomicity_contract?sslmode=disable
          PGPASSWORD: cpe-contract-password
        run: |
          psql -h 127.0.0.1 -U cpe -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE cpe_hosted_atomicity_contract'
          php tests/hosted_install_atomicity_contract.php

      - name: Run PostgreSQL database-ownership contract
        env:
          CPE_DATABASE_URL: postgresql://cpe:cpe-contract-password@127.0.0.1:5432/cpe_database_ownership_contract?sslmode=disable
          PGPASSWORD: cpe-contract-password
        run: |
          psql -h 127.0.0.1 -U cpe -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE cpe_database_ownership_contract'
          php tests/database_ownership_contract.php

      - name: Run PostgreSQL migration-lock contract
        env:
          CPE_DATABASE_URL: postgresql://cpe:cpe-contract-password@127.0.0.1:5432/cpe_migration_lock_contract?sslmode=disable
          PGPASSWORD: cpe-contract-password
        run: |
          psql -h 127.0.0.1 -U cpe -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE cpe_migration_lock_contract'
          php tests/migration_lock_contract.php

      - name: Run PostgreSQL checked lock-release contract
        env:
          CPE_DB_DRIVER: pgsql
          CPE_DATABASE_URL: postgresql://cpe:cpe-contract-password@127.0.0.1:5432/cpe_database_lock_release_contract?sslmode=disable
          PGPASSWORD: cpe-contract-password
        run: |
          psql -h 127.0.0.1 -U cpe -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE cpe_database_lock_release_contract'
          php tests/database_lock_release_contract.php

      - name: Run PostgreSQL invalid-connection cleanup contract
        env:
          CPE_DB_DRIVER: pgsql
          CPE_DATABASE_URL: postgresql://cpe:cpe-contract-password@127.0.0.1:5432/cpe_database_connection_cleanup_contract?sslmode=disable
          PGPASSWORD: cpe-contract-password
        run: |
          psql -h 127.0.0.1 -U cpe -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE cpe_database_connection_cleanup_contract'
          php tests/database_connection_cleanup_contract.php

      - name: Run PostgreSQL install-concurrency contract
        env:
          CPE_DB_DRIVER: pgsql
          CPE_DATABASE_URL: postgresql://cpe:cpe-contract-password@127.0.0.1:5432/cpe_install_concurrency_contract?sslmode=disable
          PGPASSWORD: cpe-contract-password
        run: |
          psql -h 127.0.0.1 -U cpe -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE cpe_install_concurrency_contract'
          php tests/install_concurrency_contract.php

      - name: Check publication hygiene
        run: |
          CPE_PACKAGE_VERSION="$(php -r '$config = require "config/defaults.php"; echo $config["app"]["version"];')"
          php placement publication-check
          php placement package --target="$RUNNER_TEMP/cpe-package"
          php placement verify-package "$RUNNER_TEMP/cpe-package/campus-placement-engine-${CPE_PACKAGE_VERSION}.tar.gz"
          php placement verify-package "$RUNNER_TEMP/cpe-package/campus-placement-engine-${CPE_PACKAGE_VERSION}.zip"
          cd "$RUNNER_TEMP/cpe-package"
          sha256sum --check SHA256SUMS

      - name: Smoke demo install and operations
        run: |
          php placement setup --check
          export CPE_DB_PATH="$RUNNER_TEMP/cpe-cli-install.sqlite"
          CPE_ADMIN_PASSWORD=password123 php placement install --college="CI College" --admin-name="CI Admin" --admin-email=ci-admin@example.test
          php placement doctor
          php placement serve --help

          export CPE_DB_PATH="$RUNNER_TEMP/cpe-ci.sqlite"
          php placement install-demo
          php placement doctor
          php placement upgrade
          php placement readiness
          php placement metrics
          php placement placement-report
          php placement privacy-report
          php placement export "$RUNNER_TEMP/cpe-export"
          php placement export "$RUNNER_TEMP/cpe-export-summary" --profile=summary
          php placement rollback-import --list
          php placement config-export "$RUNNER_TEMP/cpe-config.json"
          php placement config-validate "$RUNNER_TEMP/cpe-config.json"
          php placement config-validate examples/config-templates/engineering-multi-branch.json
          php placement config-import "$RUNNER_TEMP/cpe-config.json"
          php placement deliver-notifications --dry-run
          php placement deliver-notifications --channel=email --dry-run
          php placement deliver-notifications --channel=sms --dry-run
          php placement deliver-notifications --channel=whatsapp --dry-run
          CPE_DOMAIN_EVENT_OUTBOX_PATH="$RUNNER_TEMP/cpe-domain-events.jsonl" php placement work-outbox
          php placement work-integrations
          CPE_NOTIFICATION_SMS_TO=ci-sms-route CPE_NOTIFICATION_SMS_OUTBOX_PATH="$RUNNER_TEMP/cpe-sms-cert.jsonl" php placement certify-notifications --channel=sms
          CPE_NOTIFICATION_WHATSAPP_TO=ci-whatsapp-route CPE_NOTIFICATION_WHATSAPP_OUTBOX_PATH="$RUNNER_TEMP/cpe-whatsapp-cert.jsonl" php placement certify-notifications --channel=whatsapp
          php placement seed-large-demo 40 6
          php placement browser-qa-plan --base-url=http://127.0.0.1:8000 --format=markdown --candidate-target=40 --company-target=6
          export CPE_METRICS_TOKEN=ci-metrics-token-1234567890
          php -S 127.0.0.1:8000 -t public > "$RUNNER_TEMP/cpe-server.log" 2>&1 &
          CPE_SERVER_PID=$!
          trap 'kill "$CPE_SERVER_PID" 2>/dev/null || true' EXIT
          sleep 1
          curl --fail --silent --show-error http://127.0.0.1:8000/health.php
          curl --fail --silent --show-error 'http://127.0.0.1:8000/health.php?ready=1'
          curl --fail --silent --show-error --header "Authorization: Bearer $CPE_METRICS_TOKEN" http://127.0.0.1:8000/metrics.php
          php placement smoke-http --base-url=http://127.0.0.1:8000 --email=admin@example.test --password=password123 --restricted-email=atlas@example.test --restricted-password=password123
          php placement load-smoke --base-url=http://127.0.0.1:8000 --requests=20 --concurrency=4 --max-p95-ms=5000
          php placement suggest-slots
          php placement optimize-slots
          php placement assign-slots
          php placement assign-optimized-slots
