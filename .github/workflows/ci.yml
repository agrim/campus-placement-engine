name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP 8.2
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cpe
          POSTGRES_PASSWORD: cpe-contract-password
          POSTGRES_DB: cpe_contract
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cpe -d cpe_contract"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_sqlite, sqlite3, pdo_pgsql, curl
          coverage: none

      - name: Show runtime
        run: php -v

      - name: Lint PHP files
        run: |
          find app config public tests -name '*.php' -print0 | xargs -0 -n 1 php -l
          php -l placement

      - name: Run test suite
        run: |
          php tests/run.php
          php tests/database_contract.php
          php tests/managed_hosting_contract.php

      - name: Run PostgreSQL database contract
        env:
          CPE_DB_DRIVER: pgsql
          CPE_DATABASE_URL: postgresql://cpe:cpe-contract-password@127.0.0.1:5432/cpe_contract?sslmode=disable
        run: php tests/database_contract.php

      - name: Check publication hygiene
        run: |
          CPE_PACKAGE_VERSION="$(php -r '$config = require "config/defaults.php"; echo $config["app"]["version"];')"
          php placement publication-check
          php placement package --target="$RUNNER_TEMP/cpe-package"
          php placement verify-package "$RUNNER_TEMP/cpe-package/campus-placement-engine-${CPE_PACKAGE_VERSION}.tar.gz"
          php placement verify-package "$RUNNER_TEMP/cpe-package/campus-placement-engine-${CPE_PACKAGE_VERSION}.zip"
          cd "$RUNNER_TEMP/cpe-package"
          sha256sum --check SHA256SUMS

      - name: Smoke demo install and operations
        run: |
          php placement setup --check
          export CPE_DB_PATH="$RUNNER_TEMP/cpe-cli-install.sqlite"
          CPE_ADMIN_PASSWORD=password123 php placement install --college="CI College" --admin-name="CI Admin" --admin-email=ci-admin@example.test
          php placement doctor
          php placement serve --help

          export CPE_DB_PATH="$RUNNER_TEMP/cpe-ci.sqlite"
          php placement install-demo
          php placement doctor
          php placement upgrade
          php placement readiness
          php placement metrics
          php placement placement-report
          php placement privacy-report
          php placement export "$RUNNER_TEMP/cpe-export"
          php placement export "$RUNNER_TEMP/cpe-export-summary" --profile=summary
          php placement rollback-import --list
          php placement config-export "$RUNNER_TEMP/cpe-config.json"
          php placement config-validate "$RUNNER_TEMP/cpe-config.json"
          php placement config-validate examples/config-templates/engineering-multi-branch.json
          php placement config-import "$RUNNER_TEMP/cpe-config.json"
          php placement deliver-notifications --dry-run
          php placement deliver-notifications --channel=email --dry-run
          php placement deliver-notifications --channel=sms --dry-run
          php placement deliver-notifications --channel=whatsapp --dry-run
          CPE_DOMAIN_EVENT_OUTBOX_PATH="$RUNNER_TEMP/cpe-domain-events.jsonl" php placement work-outbox
          CPE_NOTIFICATION_SMS_TO=ci-sms-route CPE_NOTIFICATION_SMS_OUTBOX_PATH="$RUNNER_TEMP/cpe-sms-cert.jsonl" php placement certify-notifications --channel=sms
          CPE_NOTIFICATION_WHATSAPP_TO=ci-whatsapp-route CPE_NOTIFICATION_WHATSAPP_OUTBOX_PATH="$RUNNER_TEMP/cpe-whatsapp-cert.jsonl" php placement certify-notifications --channel=whatsapp
          php placement seed-large-demo 40 6
          php placement browser-qa-plan --base-url=http://127.0.0.1:8000 --format=markdown --candidate-target=40 --company-target=6
          export CPE_METRICS_TOKEN=ci-metrics-token-1234567890
          php -S 127.0.0.1:8000 -t public > "$RUNNER_TEMP/cpe-server.log" 2>&1 &
          CPE_SERVER_PID=$!
          trap 'kill "$CPE_SERVER_PID" 2>/dev/null || true' EXIT
          sleep 1
          curl --fail --silent --show-error http://127.0.0.1:8000/health.php
          curl --fail --silent --show-error 'http://127.0.0.1:8000/health.php?ready=1'
          curl --fail --silent --show-error --header "Authorization: Bearer $CPE_METRICS_TOKEN" http://127.0.0.1:8000/metrics.php
          php placement smoke-http --base-url=http://127.0.0.1:8000 --email=admin@example.test --password=password123 --restricted-email=atlas@example.test --restricted-password=password123
          php placement load-smoke --base-url=http://127.0.0.1:8000 --requests=20 --concurrency=4 --max-p95-ms=5000
          php placement suggest-slots
          php placement optimize-slots
          php placement assign-slots
          php placement assign-optimized-slots
