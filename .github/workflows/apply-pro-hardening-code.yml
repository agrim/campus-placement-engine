name: Apply staged Pro hardening patch

on:
  push:
    branches:
      - pro/production-readiness-hardening-2026-08-30
    paths:
      - .github/pro-hardening-code.patch.gz.b64
      - .github/workflows/apply-pro-hardening-code.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out staged branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Apply verified patch and remove bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/pro-hardening-code.patch.gz.b64 \
            | gzip --decompress > "$RUNNER_TEMP/pro-hardening.patch"
          git apply --check "$RUNNER_TEMP/pro-hardening.patch"
          git apply "$RUNNER_TEMP/pro-hardening.patch"
          git rm .github/pro-hardening-code.patch.gz.b64 \
            .github/workflows/apply-pro-hardening-code.yml
          git add app/Controllers/AdminController.php
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Make admin settings and audit update atomic'
          git push origin "HEAD:${GITHUB_REF_NAME}"
