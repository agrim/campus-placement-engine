name: Apply staged production-readiness README link

on:
  push:
    branches:
      - pro/production-readiness-hardening-2026-08-30
    paths:
      - .github/pro-readme.patch.b64
      - .github/workflows/apply-pro-readme.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Update README and remove bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          contents = path.read_text(encoding='utf-8')
          old = '''management plane can run the same Engine release as a hosted service without
          forking placement behaviour. The accepted architecture and staged implementation gates are documented in
          [docs/career-services-portal-architecture.md](docs/career-services-portal-architecture.md).

          This modernization is intentionally dependency-light:'''
          new = '''management plane can run the same Engine release as a hosted service without
          forking placement behaviour. The accepted architecture and staged implementation gates are documented in
          [docs/career-services-portal-architecture.md](docs/career-services-portal-architecture.md).

          The current release is an evaluation alpha rather than an unqualified production
          claim. Required source, CI, deployment, accessibility, capacity, backup, security,
          privacy, and institutional evidence is tracked in
          [the production-readiness boundary](docs/production-readiness.md) and
          [the production epic](https://github.com/agrim/campus-placement-engine/issues/22).

          This modernization is intentionally dependency-light:'''
          if old not in contents:
              raise SystemExit('Expected README architecture block is missing.')
          path.write_text(contents.replace(old, new, 1), encoding='utf-8')
          PY
          git rm .github/pro-readme.patch.b64 .github/workflows/apply-pro-readme.yml
          git add README.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Link production readiness from README'
          git push origin "HEAD:${GITHUB_REF_NAME}"
