name: Review evidence

on:
  push:
    branches: ["review/legacy-fidelity-2026-09-05"]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Archive only tracked source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/review-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/review-evidence/commit.txt"
          git archive --format=tar HEAD | gzip -n > "$RUNNER_TEMP/review-evidence/source.tar.gz"
          cd "$RUNNER_TEMP/review-evidence"
          sha256sum source.tar.gz > source.tar.gz.sha256
      - name: Retain review snapshot briefly
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: review-source-${{ github.sha }}
          path: ${{ runner.temp }}/review-evidence/
          if-no-files-found: error
          retention-days: 3
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtain Debian runtime packages for isolated offline tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/review-runtime"
          docker run --rm --volume "$RUNNER_TEMP/review-runtime:/out" debian:trixie-slim sh -ec '
            apt-get update >/dev/null
            cd /out
            apt-get download php8.4-sqlite3 php8.4-mbstring php8.4-pgsql libonig5 libpq5 postgresql-17 postgresql-client-17
            sha256sum *.deb > SHA256SUMS
          '
          docker image inspect debian:trixie-slim --format '{{json .RepoDigests}}' > "$RUNNER_TEMP/review-runtime/image-digest.json"
      - name: Retain test-runtime packages briefly
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: review-runtime-${{ github.sha }}
          path: ${{ runner.temp }}/review-runtime/
          if-no-files-found: error
          retention-days: 3
